version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: satquery-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SATQUERY_HOST=0.0.0.0
      - SATQUERY_PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ../backend/data/samples:/app/backend/data/samples
    networks:
      - satquery-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: satquery-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - satquery-network

networks:
  satquery-network:
    driver: bridge
